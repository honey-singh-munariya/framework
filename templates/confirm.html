<html>
    <head>
        <title>Confirm Registration</title>
    </head>
    <body>
        <h1>Confirm Registration</h1>
        <p>Please confirm your registration details:</p>

        <table>
            <tr>
                <td>Name:</td>
                <td>{{ name }}</td>
            </tr>
            <tr>
                <td>Email:</td>
                <td>{{email}}</td>
            </tr>
            <tr>
                <td>Phone:</td>
                <td>{{phone_number}}</td>
            </tr>   

        </table>
    </body>



</html>
